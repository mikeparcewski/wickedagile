name: Deploy site to GitHub Pages

# Deploys the site on every push to main and nightly (DES-SITES-V2 §6.9: a new Medium post or bit publishes without a
# PR); also runnable by hand. The build fetches the Medium feed, bits.json and the lab's exports, each falling back
# to the file the live site last served, then the committed seed; the graph build fails on any rule break, and the
# layout audit runs on the built page before it deploys.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (live sources, with fallbacks)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Layout audit at the five viewports (the map's oracle and the frame rule), and every lab link opens its lab view
        run: npx playwright test tests/e2e/oracle.spec.ts tests/e2e/frames.spec.ts tests/e2e/lab-links.spec.ts

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
