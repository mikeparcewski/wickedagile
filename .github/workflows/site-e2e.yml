name: Site E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "tests/**"
      - "playwright.config.ts"
      - ".github/workflows/site-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Graph self-test and Playwright ports
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # the e2e build reads the committed seeds only: deterministic and offline (the deploy build fetches live)
      WA_SOURCES: seed
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Graph build self-test (the build rules on broken inputs)
        run: npm run graph:selftest
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the renamed-door copy (labels.work = Build, for the rename check)
        run: npm run build:renamed
      - name: Build site
        run: npm run build
      - name: Run the e2e ports (test3, audit3, frames, chrome, render smoke, v3 smoke)
        run: npm run test:e2e
      - name: Upload Playwright report and the smoke screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
